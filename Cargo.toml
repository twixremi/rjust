[package]
name = "rjust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
ctor = "0.2"
libloading = "0.8"
libc = "0.2"
anyhow = "1.0"
tracing = "0.1"
shared_memory = "0.12"
raw_sync = "0.1"
once_cell = "1.19"
chrono = "0.4.44"

[[bin]]
name = "rjust-worker"
path = "src/bin/worker.rs"

[target.'cfg(target_os = "linux")'.dependencies]
libseccomp = "0.3"
evdev = "0.12"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.45.0", features = ["Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Console"] }
detour = { package = "retour", version = "0.3.1", features = ["nightly"] }